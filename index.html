<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thing VR - WebXR Hands</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: monospace;
    }
    #debug-console {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 6px;
      font-size: 13px;
      z-index: 1000;
      max-height: 150px;
      overflow-y: auto;
    }
    #vr-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border: 1px solid #fff;
      border-radius: 4px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      z-index: 999;
    }
  </style>

  <!-- Load core standalone libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <div id="debug-console">Loading standalone WebXR engine...</div>
  <button id="vr-button" style="display:none;">ENTER VR</button>

  <script>
    const logEl = document.getElementById('debug-console');
    function log(msg, isError = false) {
      console.log(msg);
      logEl.innerHTML += `<br/><span style="color:${isError ? '#ff4444' : '#00ff88'}">${msg}</span>`;
    }

    window.onerror = function(msg, url, line) {
      log("SCRIPT ERROR: " + msg + " (Line " + line + ")", true);
    };

    function startApp() {
      log("Core libraries loaded cleanly!");

      // 1. THREE.JS SCENE SETUP
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a20);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
      const userRig = new THREE.Group();
      userRig.add(camera);
      scene.add(userRig);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(2, 4, 2);
      scene.add(light);

      // 2. CANNON.JS PHYSICS SETUP
      const world = new CANNON.World();
      world.gravity.set(0, -9.81, 0);
      const mat = new CANNON.Material();

      // Physical Table
      const tableBody = new CANNON.Body({ mass: 0, material: mat });
      tableBody.addShape(new CANNON.Plane());
      tableBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      tableBody.position.set(0, 0.8, -0.5);
      world.addBody(tableBody);

      // Visual Table
      const tableMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.05, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x5a3d28 })
      );
      tableMesh.position.set(0, 0.8, -0.5);
      scene.add(tableMesh);

      // Falling Physics "Thing" Hand Box
      const handBody = new CANNON.Body({ mass: 1.0, material: mat });
      handBody.addShape(new CANNON.Box(new CANNON.Vec3(0.06, 0.02, 0.08)));
      handBody.position.set(0, 1.2, -0.4);
      world.addBody(handBody);

      const handMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.04, 0.16),
        new THREE.MeshStandardMaterial({ color: 0x00e5ff })
      );
      scene.add(handMesh);

      // 3. RENDERER & WEBXR SETUP
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Setup native WebXR Hands directly through WebXR Controller API
      const hand0 = renderer.xr.getHand(0);
      userRig.add(hand0);

      const hand1 = renderer.xr.getHand(1);
      userRig.add(hand1);

      // 4. WEBXR NATIVE ENTER VR BUTTON LOGIC
      const vrButton = document.getElementById('vr-button');

      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            log("WebXR VR Supported on Quest 3! Click ENTER VR below.");
            vrButton.style.display = 'block';

            vrButton.onclick = () => {
              navigator.xr.requestSession('immersive-vr', {
                optionalFeatures: ['hand-tracking', 'local-floor']
              }).then((session) => {
                renderer.xr.setSession(session);
                vrButton.style.display = 'none';
                log("VR Session started!");
              }).catch(err => log("Session Start Failed: " + err.message, true));
            };
          } else {
            log("ERROR: Immersive VR not supported in this browser mode.", true);
          }
        }).catch(err => log("XR Error: " + err.message, true));
      } else {
        log("ERROR: navigator.xr missing! Make sure you are using https:// in GitHub Pages.", true);
      }

      // 5. MAIN LOOP
      renderer.setAnimationLoop(function() {
        if (renderer.xr.isPresenting) {
          world.step(1 / 60);

          // Sync physical hand box visual to physics body
          handMesh.position.copy(handBody.position);
          handMesh.quaternion.copy(handBody.quaternion);

          // Apply force pulling physical hand toward tracked Quest hand position
          if (hand0 && hand0.position) {
            const targetPos = new THREE.Vector3();
            hand0.getWorldPosition(targetPos);

            const forceX = (targetPos.x - handBody.position.x) * 250.0;
            const forceY = (targetPos.y - handBody.position.y) * 250.0;
            const forceZ = (targetPos.z - handBody.position.z) * 250.0;

            handBody.applyForce(new CANNON.Vec3(forceX, forceY, forceZ), handBody.position);
          }
        }
        renderer.render(scene, camera);
      });
    }

    window.onload = startApp;
  </script>
</body>
</html>
