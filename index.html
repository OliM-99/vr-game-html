<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thing VR - WebXR Hands</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: monospace;
    }
    #debug-console {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 6px;
      font-size: 13px;
      z-index: 1000;
      max-height: 150px;
      overflow-y: auto;
      pointer-events: none;
    }
  </style>

  <!-- Import maps load Three.js and Cannon module directly without script tag blocks -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "cannon-es": "https://unpkg.com/cannon-es@0.22.0/dist/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <div id="debug-console">Initializing WebXR scene...</div>

  <script type="module">
    import * as THREE from 'three';
    import * as CANNON from 'cannon-es';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    const logEl = document.getElementById('debug-console');
    function log(msg, isError = false) {
      console.log(msg);
      logEl.innerHTML += `<br/><span style="color:${isError ? '#ff4444' : '#00ff88'}">${msg}</span>`;
    }

    // Catch runtime errors and show them on screen
    window.addEventListener('error', (e) => log(`RUNTIME ERROR: ${e.message}`, true));

    try {
      // 1. SCENE & CAMERA SETUP
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a20);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
      const userRig = new THREE.Group();
      userRig.add(camera);
      scene.add(userRig);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(2, 4, 2);
      scene.add(light);

      // 2. CANNON PHYSICS SETUP
      const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.81, 0) });
      const mat = new CANNON.Material();

      // Table Physics & Visual
      const tableBody = new CANNON.Body({ mass: 0, material: mat });
      tableBody.addShape(new CANNON.Plane());
      tableBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      tableBody.position.set(0, 0.8, -0.5);
      world.addBody(tableBody);

      const tableMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.05, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x5a3d28 })
      );
      tableMesh.position.set(0, 0.8, -0.5);
      scene.add(tableMesh);

      // Hand Physics & Visual
      const handBody = new CANNON.Body({ mass: 1.0, material: mat });
      handBody.addShape(new CANNON.Box(new CANNON.Vec3(0.06, 0.02, 0.08)));
      handBody.position.set(0, 1.2, -0.4);
      world.addBody(handBody);

      const handMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.04, 0.16),
        new THREE.MeshStandardMaterial({ color: 0x00e5ff })
      );
      scene.add(handMesh);

      // 3. RENDERER & VR SETUP
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Add default VR Button
      document.body.appendChild(VRButton.createButton(renderer));
      log("Three.js & Cannon.js initialized successfully.");

      // Hand tracking controllers
      const handModelFactory = new XRHandModelFactory();
      const hand0 = renderer.xr.getHand(0);
      hand0.add(handModelFactory.createHandModel(hand0, 'mesh'));
      userRig.add(hand0);

      // Check WebXR Browser status directly
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            log("WebXR VR Supported! Click 'ENTER VR' at the bottom of screen.");
          } else {
            log("WebXR not supported on this device/browser.", true);
          }
        }).catch(err => log("XR Support Check Error: " + err.message, true));
      } else {
        log("Navigator.xr not found. Ensure HTTPS is enforced on GitHub Pages!", true);
      }

      // Loop
      let lastIndexTipZ = 0;
      renderer.setAnimationLoop(() => {
        if (renderer.xr.isPresenting) {
          world.step(1 / 60);
          handMesh.position.copy(handBody.position);
          handMesh.quaternion.copy(handBody.quaternion);

          if (hand0 && hand0.position) {
            const targetPos = new THREE.Vector3();
            hand0.getWorldPosition(targetPos);
            const force = targetPos.sub(handBody.position).multiplyScalar(250.0);
            handBody.applyForce(new CANNON.Vec3(force.x, force.y, force.z), handBody.position);
          }
        }
        renderer.render(scene, camera);
      });

    } catch (e) {
      log("SETUP EXCEPTION: " + e.message, true);
    }
  </script>
</body>
</html>
