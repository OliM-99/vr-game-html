<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thing VR - WebXR Hands</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: monospace;
    }
    #debug-console {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.85);
      color: #00ff88;
      border: 1px solid #00ff88;
      border-radius: 6px;
      font-size: 13px;
      z-index: 1000;
      max-height: 150px;
      overflow-y: auto;
    }
  </style>

  <!-- Load Classic Universal Scripts directly (No Import Maps / ES Modules) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/XRHandModelFactory.js"></script>
</head>
<body>
  <div id="debug-console">Loading WebXR engine...</div>

  <script>
    const logEl = document.getElementById('debug-console');
    function log(msg, isError = false) {
      console.log(msg);
      logEl.innerHTML += `<br/><span style="color:${isError ? '#ff4444' : '#00ff88'}">${msg}</span>`;
    }

    // Catch global script errors
    window.onerror = function(msg, url, line) {
      log("SCRIPT ERROR: " + msg + " (Line " + line + ")", true);
    };

    function startApp() {
      log("Scripts loaded. Setting up 3D scene...");

      // 1. THREE.JS SCENE SETUP
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a20);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
      const userRig = new THREE.Group();
      userRig.add(camera);
      scene.add(userRig);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(2, 4, 2);
      scene.add(light);

      // 2. CANNON.JS PHYSICS SETUP
      const world = new CANNON.World();
      world.gravity.set(0, -9.81, 0);

      const mat = new CANNON.Material();

      // Table Physics
      const tableBody = new CANNON.Body({ mass: 0, material: mat });
      tableBody.addShape(new CANNON.Plane());
      tableBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      tableBody.position.set(0, 0.8, -0.5);
      world.addBody(tableBody);

      // Table Visual
      const tableMesh = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.05, 1.2),
        new THREE.MeshStandardMaterial({ color: 0x5a3d28 })
      );
      tableMesh.position.set(0, 0.8, -0.5);
      scene.add(tableMesh);

      // Hand Body Physics
      const handBody = new CANNON.Body({ mass: 1.0, material: mat });
      handBody.addShape(new CANNON.Box(new CANNON.Vec3(0.06, 0.02, 0.08)));
      handBody.position.set(0, 1.2, -0.4);
      world.addBody(handBody);

      // Visual Cyan Box for Falling Hand
      const handMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.04, 0.16),
        new THREE.MeshStandardMaterial({ color: 0x00e5ff })
      );
      scene.add(handMesh);

      // 3. RENDERER & WEBXR
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Attach VR Button
      if (typeof VRButton !== 'undefined') {
        document.body.appendChild(VRButton.createButton(renderer));
        log("VR Button added!");
      } else {
        log("VRButton script failed to load.", true);
      }

      // Hand tracking controllers
      if (typeof XRHandModelFactory !== 'undefined') {
        const handModelFactory = new XRHandModelFactory();
        const hand0 = renderer.xr.getHand(0);
        hand0.add(handModelFactory.createHandModel(hand0, 'mesh'));
        userRig.add(hand0);
      } else {
        log("XRHandModelFactory missing.", true);
      }

      // Check XR Support status
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          if (supported) {
            log("SUCCESS: WebXR Ready! Look at bottom of screen for 'ENTER VR' button.");
          } else {
            log("WARNING: Immersive VR not supported on this browser context.", true);
          }
        }).catch(err => log("XR Error: " + err.message, true));
      } else {
        log("ERROR: Navigator.xr not found. Ensure site uses HTTPS!", true);
      }

      // Main Loop
      renderer.setAnimationLoop(function() {
        if (renderer.xr.isPresenting) {
          world.step(1 / 60);
          handMesh.position.copy(handBody.position);
          handMesh.quaternion.copy(handBody.quaternion);
        }
        renderer.render(scene, camera);
      });
    }

    // Run setup once window completely finishes loading scripts
    window.onload = startApp;
  </script>
</body>
</html>
