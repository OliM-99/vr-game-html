<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thing VR - WebXR Physics Hands</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111;
      font-family: sans-serif;
    }
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
      pointer-events: none;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Cannon.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <!-- Three.js WebXR Addons -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/XRHandModelFactory.js"></script>
</head>
<body>
  <div id="info">WebXR "Thing" Hand Tracking Demo<br/>Put on Meta Quest & Press "ENTER VR"</div>

  <script>
    let container, scene, camera, renderer;
    let world, tableBody, tableMesh;
    let hand0, hand1, handModelFactory;
    let physicsHandBody, physicsHandMesh;
    
    // Locomotion tracking vars
    let userRig;
    let lastIndexTipY = 0;
    let lastIndexTipZ = 0;

    init();

    function init() {
      container = document.createElement('div');
      document.body.appendChild(container);

      // --- 1. THREE.JS SCENE SETUP ---
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x202025);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
      
      // User Camera Rig (Used to move the player around when crawling)
      userRig = new THREE.Group();
      userRig.position.set(0, 0, 0);
      userRig.add(camera);
      scene.add(userRig);

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(2, 4, 2);
      scene.add(dirLight);

      // --- 2. CANNON.JS PHYSICS WORLD SETUP ---
      world = new CANNON.World();
      world.gravity.set(0, -9.81, 0); // Real-world gravity
      world.broadphase = new CANNON.NaiveBroadphase();

      // Create Physical Table (Cannon Plane)
      const tableMat = new CANNON.Material({ friction: 0.9, restitution: 0.1 });
      tableBody = new CANNON.Body({ mass: 0, material: tableMat }); // Mass 0 = Static object
      tableBody.addShape(new CANNON.Plane());
      tableBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      tableBody.position.set(0, 0.8, -0.5); // Table height at 0.8m
      world.addBody(tableBody);

      // Visual Table (Three.js Plane)
      const tableGeo = new THREE.BoxGeometry(1.5, 0.05, 1.2);
      const tableMeshMat = new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.8 });
      tableMesh = new THREE.Mesh(tableGeo, tableMeshMat);
      tableMesh.position.set(0, 0.8, -0.5);
      scene.add(tableMesh);

      // Create Physical "Hand" RigidBody (The weight box affected by gravity)
      const handShape = new CANNON.Box(new CANNON.Vec3(0.06, 0.02, 0.08));
      physicsHandBody = new CANNON.Body({ mass: 1.0, material: tableMat }); // 1kg Hand
      physicsHandBody.addShape(handShape);
      physicsHandBody.position.set(0, 1.2, -0.4); // Start elevated above table
      world.addBody(physicsHandBody);

      // Visual Physical Hand representation (Cyan Box)
      const handMeshGeo = new THREE.BoxGeometry(0.12, 0.04, 0.16);
      const handMeshMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, wireframe: false });
      physicsHandMesh = new THREE.Mesh(handMeshGeo, handMeshMat);
      scene.add(physicsHandMesh);

      // --- 3. WEBXR RENDERER & HAND SETUP ---
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // Enable WebXR button with Hand Tracking requested feature
      document.body.appendChild(VRButton.createButton(renderer, {
        requiredFeatures: ['hand-tracking']
      }));

      // Hand Controllers Setup
      handModelFactory = new XRHandModelFactory();

      // Right Hand (Index 0)
      hand0 = renderer.xr.getHand(0);
      hand0.add(handModelFactory.createHandModel(hand0, 'mesh'));
      userRig.add(hand0);

      // Left Hand (Index 1)
      hand1 = renderer.xr.getHand(1);
      hand1.add(handModelFactory.createHandModel(hand1, 'mesh'));
      userRig.add(hand1);

      window.addEventListener('resize', onWindowResize);

      // Start main animation loop
      renderer.setAnimationLoop(render);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- 4. PHYSICS & LOCOMOTION LOOP ---
    function updatePhysics() {
      // Step Cannon.js simulation (60 FPS)
      world.step(1 / 60);

      // Sync Visual Hand Mesh to Physics Body position
      physicsHandMesh.position.copy(physicsHandBody.position);
      physicsHandMesh.quaternion.copy(physicsHandBody.quaternion);

      // Apply Spring Force pulling Physics Hand toward real tracked Right Hand
      if (hand0 && hand0.position) {
        const trackedPos = new THREE.Vector3();
        hand0.getWorldPosition(trackedPos);

        const currentPos = physicsHandBody.position;

        // Force = (TargetPos - CurrentPos) * SpringConstant
        const springConstant = 250.0;
        const forceX = (trackedPos.x - currentPos.x) * springConstant;
        const forceY = (trackedPos.y - currentPos.y) * springConstant;
        const forceZ = (trackedPos.z - currentPos.z) * springConstant;

        physicsHandBody.applyForce(new CANNON.Vec3(forceX, forceY, forceZ), currentPos);
      }

      // Check Fingertip Crawling Movement against Table
      checkFingerCrawling();
    }

    function checkFingerCrawling() {
      // Access Index Finger Tip joint on Right Hand
      const indexTip = hand0.joints['index-finger-tip'];

      if (indexTip) {
        const tipWorldPos = new THREE.Vector3();
        indexTip.getWorldPosition(tipWorldPos);

        // Check if index fingertip is touching or pressing into top of table (Y ~ 0.8)
        const tableSurfaceY = 0.82;
        if (tipWorldPos.y <= tableSurfaceY) {
          
          // Measure backward stroke distance
          const deltaZ = tipWorldPos.z - lastIndexTipZ;

          // If finger pulls BACKWARDS (+Z relative to headset), push player FORWARD (-Z)
          if (deltaZ > 0.003 && deltaZ < 0.05) {
            userRig.position.z -= deltaZ * 2.0; // Crawling impulse multiplier
          }
        }
        
        lastIndexTipZ = tipWorldPos.z;
        lastIndexTipY = tipWorldPos.y;
      }
    }

    function render() {
      if (renderer.xr.isPresenting) {
        updatePhysics();
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
