<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hand Spider - Desktop Crawl VR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <script>
      let currentLevel = 1;
      const totalLevels = 3;

      const levelData = {
        1: {
          buttonPos: { x: 0, y: 1.02, z: -0.7 },
          obstacles: []
        },
        2: {
          buttonPos: { x: 0.35, y: 1.02, z: -0.8 },
          obstacles: [
            { pos: "0 1.05 -0.6", size: "0.4 0.12 0.08", color: "#EF4444" }
          ]
        },
        3: {
          buttonPos: { x: -0.4, y: 1.02, z: -0.85 },
          obstacles: [
            { pos: "-0.15 1.05 -0.65", size: "0.12 0.15 0.2", color: "#F59E0B" },
            { pos: "0.15 1.05 -0.55", size: "0.18 0.12 0.15", color: "#8B5CF6" }
          ]
        }
      };

      // Gravity & Surface Crawling Component
      AFRAME.registerComponent('spider-hand-physics', {
        schema: {
          hand: { type: 'string', default: 'right' }
        },

        init: function () {
          this.tableY = 1.0; // Table surface resting height
          this.velocity = 0;
          this.gravity = -4.5;
          this.isGrounded = false;
          this.prevPinchPos = null;

          // Wireframe visualizer for palm physics center
          this.palmMesh = document.createElement('a-sphere');
          this.palmMesh.setAttribute('radius', '0.04');
          this.palmMesh.setAttribute('color', '#10B981');
          this.palmMesh.setAttribute('material', 'wireframe: true; emissive: #10B981; emissiveIntensity: 0.6');
          this.el.appendChild(this.palmMesh);

          // Listen ONLY to hand pinch events for traction
          this.el.addEventListener('pinchstarted', (e) => this.onCrawlStart(e));
          this.el.addEventListener('pinchend', () => this.onCrawlEnd());
        },

        onCrawlStart: function (e) {
          const rawHandPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(rawHandPos);
          this.prevPinchPos = rawHandPos.clone();
        },

        onCrawlEnd: function () {
          this.prevPinchPos = null;
        },

        tick: function (time, delta) {
          if (!delta) return;
          const dt = delta / 1000;

          const handObj = this.el.object3D;
          const rawHandPos = new THREE.Vector3();
          handObj.getWorldPosition(rawHandPos);

          // Force gravity downwards onto tabletop if tracked raw position is floating high
          if (handObj.position.y > this.tableY) {
            this.velocity += this.gravity * dt;
            this.isGrounded = false;
          } else {
            // Clamp to tabletop
            handObj.position.y = this.tableY;
            this.velocity = 0;
            this.isGrounded = true;
          }

          // Apply downwards fall towards table
          handObj.position.y += this.velocity * dt;

          // Crawling motion across the desk surface
          if (this.prevPinchPos) {
            const deltaX = rawHandPos.x - this.prevPinchPos.x;
            const deltaZ = rawHandPos.z - this.prevPinchPos.z;

            // Pull spider palm along desk surface
            handObj.position.x += deltaX * 1.8;
            handObj.position.z += deltaZ * 1.8;

            this.prevPinchPos.copy(rawHandPos);
          }

          // Check Button Hit
          const buttonEl = document.querySelector('#target-button');
          if (buttonEl) {
            const btnPos = buttonEl.object3D.position;
            const dist = handObj.position.distanceTo(btnPos);

            if (dist < 0.12) {
              this.onPressButton();
            }
          }
        },

        onPressButton: function () {
          const btnCap = document.querySelector('#button-cap');
          if (btnCap) {
            btnCap.setAttribute('position', '0 0.01 0');
          }

          setTimeout(() => {
            if (currentLevel < totalLevels) {
              currentLevel++;
              loadLevel(currentLevel);
            } else {
              const txt = document.querySelector('#hud-text');
              if (txt) txt.setAttribute('value', 'VICTORY!\nYou cleared all levels!');
            }
          }, 350);
        }
      });

      function loadLevel(levelNum) {
        const data = levelData[levelNum];
        
        const txt = document.querySelector('#hud-text');
        if (txt) txt.setAttribute('value', `LEVEL ${levelNum} / ${totalLevels}\nCrawl your hand spider to press the red button!`);

        const buttonGroup = document.querySelector('#target-button');
        buttonGroup.setAttribute('position', `${data.buttonPos.x} ${data.buttonPos.y} ${data.buttonPos.z}`);
        
        const btnCap = document.querySelector('#button-cap');
        if (btnCap) btnCap.setAttribute('position', '0 0.03 0');

        const obsContainer = document.querySelector('#obstacles-container');
        obsContainer.innerHTML = '';

        data.obstacles.forEach((obs) => {
          const box = document.createElement('a-box');
          const [w, h, d] = obs.size.split(' ');
          box.setAttribute('position', obs.pos);
          box.setAttribute('width', w);
          box.setAttribute('height', h);
          box.setAttribute('depth', d);
          box.setAttribute('color', obs.color);
          obsContainer.appendChild(box);
        });
      }

      window.addEventListener('load', () => {
        setTimeout(() => loadLevel(1), 500);
      });
    </script>

    <!-- Strictly Require Hand Tracking -->
    <a-scene webxr="optionalFeatures: hand-tracking; requiredFeatures: hand-tracking;">
      <a-sky color="#050811"></a-sky>
      <a-ambient-light color="#ffffff" intensity="0.5"></a-ambient-light>
      <a-spotlight position="0 2.5 -0.5" intensity="1.4" angle="45" penumbra="0.5"></a-spotlight>

      <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#0f172a" gridhelper="size: 20; divisions: 20; colorCenterLine: #10B981; colorGrid: #1e293b"></a-plane>

      <!-- Desk / Tabletop (Height set to Y=1.0m directly in front of camera) -->
      <a-entity id="table" position="0 0.96 -0.7">
        <!-- Table surface -->
        <a-box width="1.6" height="0.08" depth="0.8" color="#1e293b" material="roughness: 0.4; metalness: 0.2"></a-box>
        <!-- Table Legs -->
        <a-cylinder position="-0.7 -0.48 -0.3" radius="0.03" height="0.96" color="#0f172a"></a-cylinder>
        <a-cylinder position="0.7 -0.48 -0.3" radius="0.03" height="0.96" color="#0f172a"></a-cylinder>
        <a-cylinder position="-0.7 -0.48 0.3" radius="0.03" height="0.96" color="#0f172a"></a-cylinder>
        <a-cylinder position="0.7 -0.48 0.3" radius="0.03" height="0.96" color="#0f172a"></a-cylinder>
      </a-entity>

      <a-entity id="obstacles-container"></a-entity>

      <!-- Level Target Button -->
      <a-entity id="target-button" position="0 1.02 -0.7">
        <a-cylinder radius="0.1" height="0.03" color="#334155"></a-cylinder>
        <a-cylinder id="button-cap" position="0 0.03 0" radius="0.075" height="0.03" color="#EF4444" material="emissive: #EF4444; emissiveIntensity: 0.5"></a-cylinder>
      </a-entity>

      <!-- Level HUD -->
      <a-text id="hud-text" value="LEVEL 1\nCrawl your hand spider to press the red button!" position="0 1.75 -1.2" align="center" color="#10B981" width="3.5" font="mozillavr"></a-text>

      <!-- Player Rig -->
      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.5 0"></a-camera>

        <!-- Hand Tracking ONLY (No controllers, forced mesh tracking) -->
        <a-entity id="left-hand"
                  hand-tracking-controls="hand: left; modelStyle: mesh;"
                  spider-hand-physics="hand: left">
        </a-entity>

        <a-entity id="right-hand"
                  hand-tracking-controls="hand: right; modelStyle: mesh;"
                  spider-hand-physics="hand: right">
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
