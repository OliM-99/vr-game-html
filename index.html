<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spider Hand VR - WebXR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { margin: 0; overflow: hidden; background-color: #111; font-family: monospace; }
    #vr-button {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      padding: 14px 28px; border: 2px solid #00ff88; background: rgba(0,0,0,0.9);
      color: #00ff88; font-size: 18px; font-weight: bold; cursor: pointer; z-index: 999;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
  <button id="vr-button">ENTER VR SPIDER HANDS</button>

  <script>
    function startApp() {
      // 1. THREE.JS SCENE SETUP
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x111116);

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
      const userRig = new THREE.Group();
      userRig.position.set(0, 0, 0);
      userRig.add(camera);
      scene.add(userRig);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 0.8);
      light.position.set(2, 4, 2);
      scene.add(light);

      // 2. CANNON.JS PHYSICS (GRAVITY WORLD)
      const world = new CANNON.World();
      world.gravity.set(0, -9.81, 0);
      const tableMat = new CANNON.Material({ friction: 0.8 });

      // Physical Table / Floor Surface
      const tableBody = new CANNON.Body({ mass: 0, material: tableMat });
      tableBody.addShape(new CANNON.Plane());
      tableBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      tableBody.position.set(0, 0.8, -0.5);
      world.addBody(tableBody);

      // Visual Wooden Table Mesh
      const tableMesh = new THREE.Mesh(
        new THREE.BoxGeometry(2.0, 0.05, 2.0),
        new THREE.MeshStandardMaterial({ color: 0x5a3d28, roughness: 0.8 })
      );
      tableMesh.position.set(0, 0.8, -0.5);
      scene.add(tableMesh);

      // 3. PHYSICAL HAND PALM BODY (Gravity-affected "Thing")
      const palmBody = new CANNON.Body({ mass: 1.2, material: tableMat });
      palmBody.addShape(new CANNON.Box(new CANNON.Vec3(0.05, 0.02, 0.06)));
      palmBody.position.set(0, 1.2, -0.5); // Drops from air onto table
      world.addBody(palmBody);

      // Visual Mesh representations for individual finger joints
      const jointMeshes = [];
      const jointGeo = new THREE.SphereGeometry(0.012, 12, 12);
      const jointMat = new THREE.MeshStandardMaterial({ color: 0xff3366, roughness: 0.3 });

      // Create 25 Joint Spheres representing your hand structure
      for (let i = 0; i < 25; i++) {
        const mesh = new THREE.Mesh(jointGeo, jointMat);
        scene.add(mesh);
        jointMeshes.push(mesh);
      }

      // 4. WEBXR SETUP
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      const trackedHand = renderer.xr.getHand(0);
      userRig.add(trackedHand);

      document.getElementById('vr-button').onclick = () => {
        navigator.xr.requestSession('immersive-vr', {
          optionalFeatures: ['hand-tracking', 'local-floor']
        }).then((session) => {
          renderer.xr.setSession(session);
          document.getElementById('vr-button').style.display = 'none';
        });
      };

      // 5. SPIDER CRAWLING & GRAVITY LOOP
      let lastTipZ = 0;

      renderer.setAnimationLoop(function() {
        if (renderer.xr.isPresenting) {
          // Step Physics Simulation
          world.step(1 / 60);

          // Get WebXR Tracking Target Position for Right Hand
          const rawHandPos = new THREE.Vector3();
          trackedHand.getWorldPosition(rawHandPos);

          // Apply Spring Pull Force toward tracked hand (Gravity keeps hand on table until pulled up)
          if (rawHandPos.length() > 0) {
            const forceX = (rawHandPos.x - palmBody.position.x) * 200.0;
            const forceY = (rawHandPos.y - palmBody.position.y) * 200.0;
            const forceZ = (rawHandPos.z - palmBody.position.z) * 200.0;
            palmBody.applyForce(new CANNON.Vec3(forceX, forceY, forceZ), palmBody.position);
          }

          // Offset Joint Meshes relative to Falling Physics Palm Body
          let indexJointIdx = 0;
          let tipWorldZ = 0;

          trackedHand.joints && Object.keys(trackedHand.joints).forEach((jointName, idx) => {
            if (idx < 25 && jointMeshes[idx]) {
              const joint = trackedHand.joints[jointName];
              
              if (joint && joint.visible) {
                // Calculate joint position relative to the physics palm body dropping on table
                const relativeJointPos = joint.position.clone();
                jointMeshes[idx].position.set(
                  palmBody.position.x + relativeJointPos.x,
                  palmBody.position.y + relativeJointPos.y,
                  palmBody.position.z + relativeJointPos.z
                );

                if (jointName === 'index-finger-tip') {
                  tipWorldZ = jointMeshes[idx].position.z;
                }
              }
            }
          });

          // Spider Crawl Locomotion: Dragging fingers back pushes camera forward
          const tableSurfaceY = 0.82;
          if (palmBody.position.y <= tableSurfaceY + 0.05) {
            const dragZ = tipWorldZ - lastTipZ;
            // If fingertip pulls backward along table (+Z), crawl player forward (-Z)
            if (dragZ > 0.002 && dragZ < 0.08) {
              userRig.position.z -= dragZ * 2.5; 
            }
          }
          lastTipZ = tipWorldZ;
        }

        renderer.render(scene, camera);
      });
    }

    window.onload = startApp;
  </script>
</body>
</html>
