<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Box Buster</title>
    <meta name="description" content="VR Hand & Controller Box Busting Game">
    <!-- A-Frame VR Framework -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <script>
      let score = 0;

      // Component to handle box hit / explosion logic
      AFRAME.registerComponent('explodable', {
        init: function () {
          const el = this.el;

          const explode = () => {
            // Update score
            score += 10;
            const scoreEl = document.querySelector('#score-text');
            if (scoreEl) scoreEl.setAttribute('value', `Score: ${score}`);

            // Spawn visual explosion effect (expanding sphere burst)
            const pos = el.getAttribute('position');
            const color = el.getAttribute('color');
            createExplosion(pos, color);

            // Remove box from scene
            if (el.parentNode) {
              el.parentNode.removeChild(el);
            }
          };

          // Trigger on laser click, raycaster intersection, or hand pinch/touch
          el.addEventListener('click', explode);
          el.addEventListener('raycaster-intersected', function () {
            // Explode on hover/touch if controller ray strikes it
            explode();
          });
          el.addEventListener('hit', explode);
        }
      });

      // Creates a temporary particle burst when a box explodes
      function createExplosion(pos, color) {
        const scene = document.querySelector('a-scene');
        const burst = document.createElement('a-entity');
        burst.setAttribute('position', pos);

        // Core flash sphere
        const flash = document.createElement('a-sphere');
        flash.setAttribute('radius', '0.2');
        flash.setAttribute('color', color);
        flash.setAttribute('material', 'shader: flat; transparent: true; opacity: 0.9');
        flash.setAttribute('animation', 'property: scale; to: 3 3 3; dur: 250; easing: easeOutQuad');
        flash.setAttribute('animation__fade', 'property: components.material.material.opacity; to: 0; dur: 250; easing: easeInQuad');
        burst.appendChild(flash);

        // Debris particles
        for (let i = 0; i < 8; i++) {
          const particle = document.createElement('a-box');
          particle.setAttribute('size', '0.08');
          particle.setAttribute('scale', '0.08 0.08 0.08');
          particle.setAttribute('color', color);
          
          const dx = (Math.random() - 0.5) * 2;
          const dy = (Math.random() - 0.5) * 2;
          const dz = (Math.random() - 0.5) * 2;
          
          particle.setAttribute('animation', `property: position; to: ${dx} ${dy} ${dz}; dur: 400; easing: easeOutQuad`);
          particle.setAttribute('animation__scale', 'property: scale; to: 0 0 0; dur: 400; easing: easeInQuad');
          burst.appendChild(particle);
        }

        scene.appendChild(burst);

        // Clean up burst entities after animation finishes
        setTimeout(() => {
          if (burst.parentNode) burst.parentNode.removeChild(burst);
        }, 450);
      }

      // Spawner component that continuously generates boxes falling in a circle around the player
      AFRAME.registerComponent('box-spawner', {
        init: function () {
          this.colors = ['#FF2D55', '#FF9500', '#FFCC00', '#4CD964', '#5AC8FA', '#007AFF', '#5856D6', '#FF2D55'];
          this.timer = setInterval(() => this.spawnBox(), 1200); // Spawns a box every 1.2s
        },
        spawnBox: function () {
          const scene = document.querySelector('a-scene');
          const box = document.createElement('a-box');

          // Choose a random angle around the circle (radius 2.5m to 4m around player)
          const angle = Math.random() * Math.PI * 2;
          const radius = 2.5 + Math.random() * 1.5;
          const x = Math.cos(angle) * radius;
          const z = Math.sin(angle) * radius;
          const startY = 4 + Math.random() * 2; // Start high in the sky

          const randomColor = this.colors[Math.floor(Math.random() * this.colors.length)];
          const size = 0.3 + Math.random() * 0.25;

          box.setAttribute('position', `${x} ${startY} ${z}`);
          box.setAttribute('width', size);
          box.setAttribute('height', size);
          box.setAttribute('depth', size);
          box.setAttribute('color', randomColor);
          box.setAttribute('explodable', '');
          box.setAttribute('class', 'clickable');

          // Rotation & falling animation down to ground level
          const fallDuration = 4000 + Math.random() * 2000;
          box.setAttribute('animation__fall', `property: position; to: ${x} 0.2 ${z}; dur: ${fallDuration}; easing: linear`);
          box.setAttribute('animation__rot', `property: rotation; to: ${Math.random()*360} ${Math.random()*360} ${Math.random()*360}; dur: ${fallDuration}; easing: linear`);

          scene.appendChild(box);

          // Auto-remove box if it hits the ground without being hit
          setTimeout(() => {
            if (box.parentNode) {
              box.parentNode.removeChild(box);
            }
          }, fallDuration);
        },
        remove: function () {
          clearInterval(this.timer);
        }
      });
    </script>

    <a-scene box-spawner physics="debug: false">
      <!-- Sky and Ambient Lighting -->
      <a-sky color="#0d1117"></a-sky>
      <a-ambient-light color="#ffffff" intensity="0.6"></a-ambient-light>
      <a-directional-light position="-1 4 2" intensity="0.8" cast-shadow="true"></a-directional-light>

      <!-- Floor grid ground -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#161b22" gridhelper="size: 30; divisions: 30; colorCenterLine: #58a6ff; colorGrid: #30363d"></a-plane>

      <!-- Floating 3D Scoreboard HUD -->
      <a-entity position="0 2.5 -2.5">
        <a-text id="score-text" value="Score: 0" align="center" color="#58a6ff" width="6" font="mozillavr"></a-text>
      </a-entity>

      <!-- Camera Rig -->
      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0">
          <!-- Desktop / Mobile mouse pointer raycaster -->
          <a-cursor objects=".clickable" color="#00E5FF" raycaster="objects: .clickable; far: 10"></a-cursor>
        </a-camera>

        <!-- VR Controllers (Laser pointers for Quest/Vive/Index) -->
        <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 10; showLine: true" line="color: #FF007F; opacity: 0.8"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 10; showLine: true" line="color: #00E5FF; opacity: 0.8"></a-entity>

        <!-- VR Hand Tracking Controls (Meta Quest / Apple Vision Pro) -->
        <a-entity hand-tracking-controls="hand: left" raycaster="objects: .clickable; far: 5; showLine: true"></a-entity>
        <a-entity hand-tracking-controls="hand: right" raycaster="objects: .clickable; far: 5; showLine: true"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
