<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Hand Tracking - Telekinesis Lab</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <script>
      // Global state & Telekinesis Component
      AFRAME.registerComponent('telekinesis-hand', {
        schema: {
          hand: { type: 'string', default: 'right' }
        },

        init: function () {
          this.grabbedEl = null;
          this.hoveredEl = null;
          this.isGrabbing = false;
          this.prevPinchState = false;

          // Target reticle visualizer
          this.reticle = document.createElement('a-ring');
          this.reticle.setAttribute('radius-inner', '0.04');
          this.reticle.setAttribute('radius-outer', '0.06');
          this.reticle.setAttribute('material', 'color: #00E5FF; shader: flat; transparent: true; opacity: 0');
          this.reticle.setAttribute('visible', 'false');
          this.el.sceneEl.appendChild(this.reticle);

          // Listen for WebXR pinch events (supported on Quest / Vision Pro)
          this.el.addEventListener('pinchstarted', () => this.onPinchStart());
          this.el.addEventListener('pinchend', () => this.onPinchEnd());

          // Desktop fallback trigger (Mouse Click / Trigger simulate grab)
          this.el.addEventListener('triggerdown', () => this.onPinchStart());
          this.el.addEventListener('triggerup', () => this.onPinchEnd());
        },

        onPinchStart: function () {
          this.isGrabbing = true;

          // Force Grab: Pull hovered object to hand if pointing at one
          if (this.hoveredEl && !this.grabbedEl) {
            this.grabbedEl = this.hoveredEl;
            this.grabbedEl.setAttribute('telekinetic-state', 'pulling');
            
            // Visual feedback ring glow
            if (this.grabbedEl.components['glow-highlight']) {
              this.grabbedEl.components['glow-highlight'].setGlow('#FF007F');
            }
          }
        },

        onPinchEnd: function () {
          this.isGrabbing = false;

          if (this.grabbedEl) {
            // Release item
            this.grabbedEl.setAttribute('telekinetic-state', 'idle');
            if (this.grabbedEl.components['glow-highlight']) {
              this.grabbedEl.components['glow-highlight'].resetGlow();
            }
            this.grabbedEl = null;
          }
        },

        tick: function (time, delta) {
          const handPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(handPos);

          // Get raycaster direction from hand
          const raycasterComp = this.el.components.raycaster;
          let intersectedEl = null;

          if (raycasterComp && raycasterComp.intersections.length > 0) {
            intersectedEl = raycasterComp.intersections[0].object.el;
          }

          // Handle Hover Highlighting
          if (intersectedEl !== this.hoveredEl && !this.grabbedEl) {
            if (this.hoveredEl && this.hoveredEl.components['glow-highlight']) {
              this.hoveredEl.components['glow-highlight'].resetGlow();
            }
            this.hoveredEl = intersectedEl;

            if (this.hoveredEl && this.hoveredEl.components['glow-highlight']) {
              this.hoveredEl.components['glow-highlight'].setGlow('#00E5FF');
            }
          }

          // Update Reticle position
          if (this.hoveredEl && !this.grabbedEl) {
            const targetPos = new THREE.Vector3();
            this.hoveredEl.object3D.getWorldPosition(targetPos);
            this.reticle.setAttribute('position', targetPos);
            this.reticle.setAttribute('visible', 'true');
            this.reticle.setAttribute('material', 'opacity', '0.8');
          } else {
            this.reticle.setAttribute('visible', 'false');
          }

          // Move pulled object towards palm
          if (this.grabbedEl) {
            const objPos = this.grabbedEl.object3D.position;
            
            // Interpolate position toward hand (Telekinetic fly speed)
            const speed = 0.12; 
            objPos.lerp(handPos, speed);

            // Slightly float and rotate item while held in air
            this.grabbedEl.object3D.rotation.y += 0.02;
            this.grabbedEl.object3D.rotation.x += 0.01;
          }
        }
      });

      // Simple highlight effect for telekinetic targets
      AFRAME.registerComponent('glow-highlight', {
        init: function () {
          this.originalColor = this.el.getAttribute('color') || '#ffffff';
        },
        setGlow: function (colorHex) {
          this.el.setAttribute('material', 'emissive', colorHex);
          this.el.setAttribute('material', 'emissiveIntensity', '0.6');
        },
        resetGlow: function () {
          this.el.setAttribute('material', 'emissive', '#000000');
          this.el.setAttribute('material', 'emissiveIntensity', '0');
        }
      });
    </script>

    <a-scene webxr="optionalFeatures: hand-tracking, hit-test">
      <!-- Environment & Sky -->
      <a-sky color="#0a0c10"></a-sky>
      <a-ambient-light color="#ffffff" intensity="0.5"></a-ambient-light>
      <a-directional-light position="-2 4 1" intensity="0.9" cast-shadow="true"></a-directional-light>

      <!-- Grid Floor -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="20" height="20" color="#111827" gridhelper="size: 20; divisions: 20; colorCenterLine: #00E5FF; colorGrid: #1F2937"></a-plane>

      <!-- The Workbench / Table -->
      <a-entity id="table" position="0 0.8 -1.2">
        <!-- Tabletop -->
        <a-box width="2.2" height="0.08" depth="1.0" color="#1E293B" material="roughness: 0.3; metalness: 0.5"></a-box>
        <!-- Table Legs -->
        <a-cylinder position="-1.0 -0.4 -0.4" radius="0.03" height="0.8" color="#334155"></a-cylinder>
        <a-cylinder position="1.0 -0.4 -0.4" radius="0.03" height="0.8" color="#334155"></a-cylinder>
        <a-cylinder position="-1.0 -0.4 0.4" radius="0.03" height="0.8" color="#334155"></a-cylinder>
        <a-cylinder position="1.0 -0.4 0.4" radius="0.03" height="0.8" color="#334155"></a-cylinder>
      </a-entity>

      <!-- Interactive Telekinetic Objects on the Table -->
      <a-entity id="objects-group">
        <!-- Cube -->
        <a-box class="telekinetic" glow-highlight position="-0.6 0.95 -1.2" width="0.18" height="0.18" depth="0.18" color="#FF2D55"></a-box>
        <!-- Glowing Energy Orb -->
        <a-sphere class="telekinetic" glow-highlight position="-0.2 0.95 -1.1" radius="0.1" color="#00E5FF"></a-sphere>
        <!-- Pyramid / Cone -->
        <a-cone class="telekinetic" glow-highlight position="0.2 0.95 -1.3" radius-bottom="0.1" height="0.2" color="#FFCC00"></a-cone>
        <!-- Cylinder Container -->
        <a-cylinder class="telekinetic" glow-highlight position="0.6 0.95 -1.1" radius="0.08" height="0.22" color="#A855F7"></a-cylinder>
      </a-entity>

      <!-- Floating Instructions Title -->
      <a-text value="TELEKINESIS LAB\nPoint at an item & quick pinch/close hand to summon it" position="0 2.2 -1.8" align="center" color="#00E5FF" width="4" font="mozillavr"></a-text>

      <!-- Camera & Player Setup -->
      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0">
          <!-- Cursor for testing with mouse on desktop -->
          <a-cursor objects=".telekinetic" color="#00E5FF" raycaster="objects: .telekinetic; far: 5"></a-cursor>
        </a-camera>

        <!-- Left Hand Tracking -->
        <a-entity hand-tracking-controls="hand: left" 
                  raycaster="objects: .telekinetic; far: 5; showLine: true" 
                  line="color: #00E5FF; opacity: 0.6"
                  telekinesis-hand="hand: left">
        </a-entity>

        <!-- Right Hand Tracking -->
        <a-entity hand-tracking-controls="hand: right" 
                  raycaster="objects: .telekinetic; far: 5; showLine: true" 
                  line="color: #00E5FF; opacity: 0.6"
                  telekinesis-hand="hand: right">
        </a-entity>

        <!-- Fallback VR Laser Controllers (if physical controllers are used instead of bare hands) -->
        <a-entity laser-controls="hand: left" raycaster="objects: .telekinetic; far: 5" telekinesis-hand="hand: left"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .telekinetic; far: 5" telekinesis-hand="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
