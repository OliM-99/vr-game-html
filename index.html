<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Hand Smash</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace, sans-serif;
      background-color: #111;
      color: #fff;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
      text-align: center;
    }
    #diagnostics {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    .status-ok { color: #00ff88; font-weight: bold; }
    /* Force VR Button to be visible */
    #VRButton {
      position: absolute !important;
      bottom: 30px !important;
      left: calc(50% - 75px) !important;
      z-index: 999 !important;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/XRHandModelFactory.js"></script>
</head>
<body>

  <div id="ui">
    <h2>VR Hand Smash</h2>
    <div id="diagnostics">
      <div>🔐 Secure Context: <span class="status-ok">PASS</span></div>
      <div>🥽 System Status: <span class="status-ok">READY FOR VR</span></div>
      <div style="margin-top: 5px; color: #aaa;">Click the button at the bottom to start!</div>
    </div>
  </div>

  <script>
    let scene, camera, renderer;
    let hand1, hand2, handModelFactory;
    const cubes = [];
    const particles = [];
    const handJoints = [];
    const colors = [0xff0055, 0x00ffcc, 0xffcc00, 0x9900ff, 0x00ff22, 0xff6600];

    init();
    animate();

    function init() {
      const container = document.createElement('div');
      document.body.appendChild(container);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
      camera.position.set(0, 1.6, 2);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(2, 4, 2);
      scene.add(dirLight);

      // Add floor grid so the screen isn't pitch black on desktop
      const grid = new THREE.GridHelper(10, 20, 0x00ffcc, 0x444444);
      grid.position.y = 0;
      scene.add(grid);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // Create VR Button
      const vrBtn = VRButton.createButton(renderer);
      document.body.appendChild(vrBtn);

      // Hand Setup
      handModelFactory = new XRHandModelFactory();

      hand1 = renderer.xr.getHand(0);
      hand1.add(handModelFactory.createHandModel(hand1, "mesh"));
      scene.add(hand1);

      hand2 = renderer.xr.getHand(1);
      hand2.add(handModelFactory.createHandModel(hand2, "mesh"));
      scene.add(hand2);

      renderer.xr.addEventListener('sessionstart', () => {
        document.getElementById('ui').style.display = 'none';
      });
      renderer.xr.addEventListener('sessionend', () => {
        document.getElementById('ui').style.display = 'block';
      });

      window.addEventListener('resize', onWindowResize);
      setInterval(spawnBrick, 1000);
    }

    function spawnBrick() {
      // Spawn bricks in desktop view AND in VR view
      const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const material = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.3 });

      const brick = new THREE.Mesh(geometry, material);
      brick.position.x = (Math.random() - 0.5) * 1.5;
      brick.position.y = 2.0 + Math.random() * 0.4;
      brick.position.z = -0.5 - Math.random() * 0.5;

      brick.userData = {
        rotX: (Math.random() - 0.5) * 0.05,
        rotY: (Math.random() - 0.5) * 0.05,
        fallSpeed: 0.004 + Math.random() * 0.003
      };

      scene.add(brick);
      cubes.push(brick);
    }

    function explodeBrick(position, color) {
      const particleCount = 15;
      const geom = new THREE.BoxGeometry(0.02, 0.02, 0.02);
      const mat = new THREE.MeshBasicMaterial({ color: color });

      for (let i = 0; i < particleCount; i++) {
        const p = new THREE.Mesh(geom, mat);
        p.position.copy(position);
        p.userData = {
          vx: (Math.random() - 0.5) * 0.08,
          vy: (Math.random() - 0.5) * 0.08,
          vz: (Math.random() - 0.5) * 0.08,
          life: 25
        };
        scene.add(p);
        particles.push(p);
      }
    }

    function updateHandJoints() {
      handJoints.length = 0;
      [hand1, hand2].forEach(hand => {
        hand.children.forEach(child => {
          if (child.joints) {
            const keyJointNames = ['index-finger-tip', 'middle-finger-tip', 'wrist', 'index-finger-phalanx-distal'];
            keyJointNames.forEach(name => {
              if (child.joints[name] && child.joints[name].visible) {
                const worldPos = new THREE.Vector3();
                child.joints[name].getWorldPosition(worldPos);
                handJoints.push(worldPos);
              }
            });
          }
        });
      });
    }

    function checkCollisions() {
      const hitRadius = 0.12;

      for (let i = cubes.length - 1; i >= 0; i--) {
        const brick = cubes[i];
        brick.position.y -= brick.userData.fallSpeed;
        brick.rotation.x += brick.userData.rotX;
        brick.rotation.y += brick.userData.rotY;

        let hit = false;
        for (let j = 0; j < handJoints.length; j++) {
          if (brick.position.distanceTo(handJoints[j]) < hitRadius) {
            hit = true;
            break;
          }
        }

        if (hit) {
          explodeBrick(brick.position, brick.material.color);
          scene.remove(brick);
          brick.geometry.dispose();
          brick.material.dispose();
          cubes.splice(i, 1);
        } else if (brick.position.y < 0.1) {
          scene.remove(brick);
          brick.geometry.dispose();
          brick.material.dispose();
          cubes.splice(i, 1);
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.life--;

        if (p.userData.life <= 0) {
          scene.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          particles.splice(i, 1);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      if (renderer.xr.isPresenting) {
        updateHandJoints();
      }
      checkCollisions();
      updateParticles();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
