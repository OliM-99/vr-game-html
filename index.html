<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebXR VR Hand Smash</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
    }
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }
  </style>
  <!-- Three.js and WebXR Helpers -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/VRButton.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/vr/XRHandModelFactory.js"></script>
</head>
<body>

  <div id="info">
    <h1>VR Hand Smash</h1>
    <p>Launch in a WebXR-compatible browser (Chrome, Edge, Quest Browser) with SteamVR or native XR active.</p>
  </div>

  <script>
    let container, scene, camera, renderer;
    let hand1, hand2;
    let handModelFactory;

    const cubes = [];
    const particles = [];
    const handJoints = [];

    // Colors for bricks
    const colors = [0xff0055, 0x00ffcc, 0xffcc00, 0x9900ff, 0x00ff22, 0xff6600];

    init();
    animate();

    function init() {
      container = document.createElement('div');
      document.body.appendChild(container);

      // 1. Scene & Camera Setup
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1a24);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
      camera.position.set(0, 1.6, 3);

      // 2. Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(2, 4, 2);
      scene.add(dirLight);

      // Floor grid for orientation
      const grid = new THREE.GridHelper(10, 20, 0x444444, 0x222222);
      grid.position.y = 0;
      scene.add(grid);

      // 3. WebXR Renderer Setup
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      document.body.appendChild(VRButton.createButton(renderer));

      // 4. VR Hand Controllers Setup
      handModelFactory = new XRHandModelFactory();

      // Hand 1 (Left)
      hand1 = renderer.xr.getHand(0);
      hand1.add(handModelFactory.createHandModel(hand1, "mesh"));
      scene.add(hand1);

      // Hand 2 (Right)
      hand2 = renderer.xr.getHand(1);
      hand2.add(handModelFactory.createHandModel(hand2, "mesh"));
      scene.add(hand2);

      // Listen for window resize
      window.addEventListener('resize', onWindowResize);

      // Periodically spawn falling bricks
      setInterval(spawnBrick, 1200);
    }

    // Spawn colorful falling bricks
    function spawnBrick() {
      if (!renderer.xr.isPresenting) return; // Only spawn while in VR

      const geometry = new THREE.BoxGeometry(0.15, 0.15, 0.15);
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const material = new THREE.MeshStandardMaterial({
        color: randomColor,
        roughness: 0.3,
        metalness: 0.2
      });

      const brick = new THREE.Mesh(geometry, material);

      // Random position around shoulder height in front of player
      brick.position.x = (Math.random() - 0.5) * 1.2;
      brick.position.y = 1.8 + Math.random() * 0.4;
      brick.position.z = -0.4 - Math.random() * 0.5;

      // Random rotational velocity
      brick.userData = {
        rotX: (Math.random() - 0.5) * 0.05,
        rotY: (Math.random() - 0.5) * 0.05,
        fallSpeed: 0.003 + Math.random() * 0.003
      };

      scene.add(brick);
      cubes.push(brick);
    }

    // Particle explosion effect
    function explodeBrick(position, color) {
      const particleCount = 20;
      const geom = new THREE.BoxGeometry(0.02, 0.02, 0.02);
      const mat = new THREE.MeshBasicMaterial({ color: color });

      for (let i = 0; i < particleCount; i++) {
        const p = new THREE.Mesh(geom, mat);
        p.position.copy(position);

        // Random directional velocity burst
        p.userData = {
          vx: (Math.random() - 0.5) * 0.08,
          vy: (Math.random() - 0.5) * 0.08,
          vz: (Math.random() - 0.5) * 0.08,
          life: 30 // frames to live
        };

        scene.add(p);
        particles.push(p);
      }
    }

    // Collect positions of hand joints for collision detection
    function updateHandJoints() {
      handJoints.length = 0; // Clear previous frame

      [hand1, hand2].forEach(hand => {
        hand.children.forEach(child => {
          if (child.joints) {
            // Check key joints like index tip, index distal, palm, thumb tip
            const keyJointNames = ['index-finger-tip', 'middle-finger-tip', 'wrist', 'index-finger-phalanx-distal'];
            keyJointNames.forEach(name => {
              if (child.joints[name]) {
                const joint = child.joints[name];
                if (joint.visible) {
                  const worldPos = new THREE.Vector3();
                  joint.getWorldPosition(worldPos);
                  handJoints.push(worldPos);
                }
              }
            });
          }
        });
      });
    }

    function checkCollisions() {
      const hitRadius = 0.12; // Distance threshold for hand-to-brick collision

      for (let i = cubes.length - 1; i >= 0; i--) {
        const brick = cubes[i];

        // 1. Move and rotate brick
        brick.position.y -= brick.userData.fallSpeed;
        brick.rotation.x += brick.userData.rotX;
        brick.rotation.y += brick.userData.rotY;

        // 2. Check collision against all active hand joint positions
        let hit = false;
        for (let j = 0; j < handJoints.length; j++) {
          if (brick.position.distanceTo(handJoints[j]) < hitRadius) {
            hit = true;
            break;
          }
        }

        // 3. Explode if touched or cleanup if fallen past floor
        if (hit) {
          explodeBrick(brick.position, brick.material.color);
          scene.remove(brick);
          brick.geometry.dispose();
          brick.material.dispose();
          cubes.splice(i, 1);
        } else if (brick.position.y < 0.2) {
          scene.remove(brick);
          brick.geometry.dispose();
          brick.material.dispose();
          cubes.splice(i, 1);
        }
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.position.x += p.userData.vx;
        p.position.y += p.userData.vy;
        p.position.z += p.userData.vz;
        p.userData.life--;

        if (p.userData.life <= 0) {
          scene.remove(p);
          p.geometry.dispose();
          p.material.dispose();
          particles.splice(i, 1);
        }
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      if (renderer.xr.isPresenting) {
        updateHandJoints();
        checkCollisions();
        updateParticles();
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
